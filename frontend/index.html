<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Śledzik</title>
    <!-- SVG dla przeglądarek, które je obsługują; PNG jako zapas.
         Ikona iOS jest bez zaokrągleń — system przycina ją własną maską. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Śledzik" />
    <!-- Dzięki temu „dodaj do ekranu głównego" na Androidzie bierze nazwę
         i ikonę stąd, a aplikacja otwiera się bez paska przeglądarki. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        margin: 0;
        background: #0a0a0a;
        /* żaden element nie może rozpychać strony w poziomie */
        overflow-x: hidden;
      }

      button, input, select, textarea { font-family: inherit; }

      /* Pola formularzy nie mogą dyktować szerokości układu: input typu number
         ma własną szerokość ~150 px i w siatce auto-fit / w wierszu flex
         rozpychał kartę poza ekran telefonu. min-width: 0 pozwala siatce go
         ścisnąć, max-width domyka do komórki, border-box liczy padding
         do środka, żeby `width: 100%` nie wystawało o padding. */
      input, select, textarea { box-sizing: border-box; min-width: 0; max-width: 100%; }

      /* Wygodniejsze cele dotykowe i brak niebieskiego błysku przy tapnięciu.
         [role="button"] to klikane div-y (kratki miesiąca, wiersze list). */
      button, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

      /* Fokus z klawiatury musi być widoczny. Pola mają inline `outline:none`,
         a inline nie ustawia box-shadow — stąd obwódka tędy, i tylko dla
         :focus-visible, żeby tapnięcie palcem jej nie zostawiało. */
      :focus-visible { outline: none; box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 4px #8fa6e8 !important; border-radius: 6px; }

      /* iOS Safari powiększa stronę przy focusie w pole o foncie <16px.
         Na wąskich ekranach wymuszamy 16px, żeby nie przeskakiwał widok. */
      @media (max-width: 640px) {
        input, select, textarea { font-size: 16px !important; }
      }

      /* ── Reakcja na dotyk ────────────────────────────────────────────
         Kliknięcie ma być odczuwalne: element ugina się pod palcem i wraca.
         Skala zamiast zmiany koloru, bo działa na każdym tle i nie wchodzi
         w drogę kolorom kategorii. Krzywa jest szybka na starcie i miękka na
         końcu — tak zachowuje się fizyczny przycisk. */
      button, [role="button"] {
        transition: transform .13s cubic-bezier(.2,.8,.3,1), background-color .18s ease,
                    border-color .18s ease, color .18s ease, opacity .18s ease;
      }
      button:active, [role="button"]:active { transform: scale(.96); }
      /* Duże płaszczyzny (wycinki sześciokąta, karty) uginają się mniej —
         ten sam procent na dużym elemencie wygląda jak skok. */
      svg [role="button"]:active { transform: scale(.985); transform-origin: center; }
      svg [role="button"] polygon { transition: fill-opacity .22s ease, stroke-opacity .22s ease, stroke-width .15s ease; }
      /* Tylko TOR rozjaśnia się pod kursorem. Gdyby reguła łapała oba
         wielokąty, najechanie przygaszałoby wypełnienie wycinka do 20 % —
         czyli kasowałoby to, co wykres ma pokazywać.
         Bez @media (hover: hover): to czysta dekoracja, na dotyku mignie przy
         tapnięciu i tyle, a opakowana w to zapytanie nie da się sprawdzić
         w przeglądarce bez myszy (headless raportuje `hover: none`). */
      svg [role="button"]:hover polygon.tor { fill-opacity: .2; stroke-opacity: .8; }

      /* Rozwinięcie sekcji: treść wjeżdża spod nagłówka, zamiast pojawiać się
         skokiem — bez tego przy sześciu działach nie widać, który się otworzył.
         Bez `both`: stan końcowy klatki jest identyczny ze stanem domyślnym,
         a wypełnianie po zakończeniu zostawiało na elemencie `transform:
         matrix(1,0,0,1,0,0)`. To nie jest `none`, więc element stawał się
         blokiem zawierającym dla `position: fixed` w środku. */
      @keyframes rozwin { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
      .rozwin { animation: rozwin .22s cubic-bezier(.2,.8,.3,1); }

      /* Wejście zawartości zakładki po kliknięciu w pasek nawigacji.
         TU ANIMUJEMY WYŁĄCZNIE PRZEZROCZYSTOŚĆ — ten element opakowuje całą
         zakładkę razem z oknami modalnymi, a każdy `transform` (nawet
         tożsamościowy, nawet tylko na czas animacji) sprawia, że `position:
         fixed` w środku liczy się względem niego, a nie względem ekranu.
         Okno dodawania produktu lądowało wtedy 800 px poniżej widoku. */
      @keyframes wejscie { from { opacity: 0; } to { opacity: 1; } }
      .wejscie { animation: wejscie .2s ease; }

      /* Odhaczenie nawyku: znacznik wskakuje, a nie po prostu jest. */
      @keyframes fajka { from { transform: scale(0); opacity: 0; } 60% { transform: scale(1.15); } to { transform: scale(1); opacity: 1; } }
      .fajka { animation: fajka .24s cubic-bezier(.2,.8,.3,1) both; }

      /* Fokus na wycinku sześciokąta NIE może być domyślnym prostokątem
         przeglądarki: na SVG rysuje się jako biały kwadrat wokół całego
         wycinka, widoczny też po kliknięciu myszą. Zamiast niego pogrubiony
         obrys samego kształtu — widać to z klawiatury i nie widać przy
         tapnięciu. */
      svg [role="button"]:focus { outline: none; box-shadow: none !important; }
      svg [role="button"]:focus-visible polygon.tor { stroke-width: 3; stroke-opacity: 1; }

      /* Dyskretny pasek przewijania w ciemnym motywie */
      * { scrollbar-width: thin; scrollbar-color: #333 transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
