<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Śledzik</title>
    <!-- SVG dla przeglądarek, które je obsługują; PNG jako zapas.
         Ikona iOS jest bez zaokrągleń — system przycina ją własną maską. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Śledzik" />
    <!-- Dzięki temu „dodaj do ekranu głównego" na Androidzie bierze nazwę
         i ikonę stąd, a aplikacja otwiera się bez paska przeglądarki. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      html { -webkit-text-size-adjust: 100%; }

      body {
        margin: 0;
        background: #0a0a0a;
        /* żaden element nie może rozpychać strony w poziomie */
        overflow-x: hidden;
      }

      button, input, select, textarea { font-family: inherit; }

      /* Wygodniejsze cele dotykowe i brak niebieskiego błysku przy tapnięciu.
         [role="button"] to klikane div-y (kratki miesiąca, wiersze list). */
      button, [role="button"] { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

      /* Fokus z klawiatury musi być widoczny. Pola mają inline `outline:none`,
         a inline nie ustawia box-shadow — stąd obwódka tędy, i tylko dla
         :focus-visible, żeby tapnięcie palcem jej nie zostawiało. */
      :focus-visible { outline: none; box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 4px #8fa6e8 !important; border-radius: 6px; }

      /* iOS Safari powiększa stronę przy focusie w pole o foncie <16px.
         Na wąskich ekranach wymuszamy 16px, żeby nie przeskakiwał widok. */
      @media (max-width: 640px) {
        input, select, textarea { font-size: 16px !important; }
      }

      /* Dyskretny pasek przewijania w ciemnym motywie */
      * { scrollbar-width: thin; scrollbar-color: #333 transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-thumb { background: #333; border-radius: 8px; }
      *::-webkit-scrollbar-track { background: transparent; }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
